plugins {
    id 'com.android.application'
}

android {
    namespace 'com.pocketvr.gundemo'
    compileSdk 34

    defaultConfig {
        applicationId 'com.pocketvr.gun'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '0.1'
    }

    // a fixed key kept in the repo (same idea as PocketVR): every build is signed the same way, so a new APK installs over the old one
    signingConfigs {
        debug {
            storeFile file('pocketvrgun.keystore')
            storePassword 'pocketvrgun'
            keyAlias 'pocketvrgun'
            keyPassword 'pocketvrgun'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// no libraries: the game is plain Android + OpenGL ES 2
dependencies {
}
