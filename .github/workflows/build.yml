name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # the rules of the game are plain Java: test them first (takes a second, needs no Android)
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Test the game rules
        run: sh test/run.sh

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        run: |
          for i in 1 2 3; do
            gradle --no-daemon assembleDebug && exit 0
            echo "build attempt $i failed, waiting before retry"; sleep $((i * 30))
          done
          exit 1

      - name: Publish APK as a release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk PocketVRGun.apk
          gh release create "gun-build-${{ github.run_number }}" PocketVRGun.apk \
            --title "PocketVR Gun build ${{ github.run_number }}" \
            --notes "Download PocketVRGun.apk and install it." --latest

      - uses: actions/upload-artifact@v4
        with:
          name: PocketVRGun-apk
          path: PocketVRGun.apk
